<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body class="bg-pink-800">
    <div class="border-2 border-pink-500 rounded-3xl m-10 pb-5">

    <h1 class="text-center py-5 text-pink-400 text-2xl">Pretty pink calculator</h1>

<div class="bg-black border border-dashed border-pink-600 rounded-2xl w-1/2 h-40 m-auto mb-5 hover:bg-pink-800">
<p class="text-pink-400 text-right pt-30 pr-1.5 text-2xl">0</p>
</div>

<div class="grid grid-cols-4 gap-3 max-w-xs m-auto">
    <button class="border border-pink-500 bg-pink-400 p-5  rounded-2xl hover:bg-pink-700">💗</button>
    <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">⬅️</button>
    <button  class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">💯</button>
    <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">➗</button>


    <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">7️</button>
     <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">8️</button>
      <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">9️</button>
    <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">✖️</button>


 <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">4️</button>
 <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">5️</button>
 <button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">6️</button>
<button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">➖</button>


<button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">1️</button>
<button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">2️</button>
<button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">3️</button>
<button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">➕</button>


<button class="border border-pink-500 bg-pink-400  rounded-2xl hover:bg-pink-700">0️</button>
<button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">🔸</button>
<button class="border border-pink-500 bg-pink-400 p-5 rounded-2xl hover:bg-pink-700">🟰</button>
</div>





    </div>











    <script src="script.js"></script>
</body>
</html>
